[package]
name = "ainovel-desktop"
version = "0.1.0"
description = "AI Novel desktop shell (Tauri 2) supervising the Go engine sidecar over the desktop-v1 NDJSON protocol."
authors = ["ainovel-cli contributors"]
license = "MIT"
repository = "https://github.com/voocel/ainovel-cli"
edition = "2021"
rust-version = "1.80"
default-run = "ainovel-desktop"
build = "build.rs"

# This crate is intentionally standalone: the repository root is a Go module,
# and desktop Rust code must never leak into it. Do not add a [workspace]
# section here without coordinating with the packaging task.

[lib]
name = "ainovel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ainovel-desktop"
path = "src/main.rs"

# Tiny protocol-speaking test double used by the Rust integration tests and by
# developers iterating on the supervisor without building the Go engine.
# Never shipped: packaging (CI task) only bundles the main binary plus the
# Go sidecar produced from the root module.
[[bin]]
name = "mock-sidecar"
path = "src/bin/mock_sidecar.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
async-trait = "0.1"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3"
# Enables `tauri::test` (mock runtime) for the app-wiring startup tests.
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
